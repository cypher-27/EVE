# ==========================================
# EVE - SINGLE SOURCE OF TRUTH (v2.0)
# STRESS TEST BUILD - generado para probar validator/janitor
# Cada bloque tiene un comentario "TEST:" explicando qué arista intenta romper.
# ==========================================

entornos:

  # === INFRAESTRUCTURA CORE (sin cambios, nunca deben tocarse) ===

  - nombre: "doom-gateway"
    estado: "presente"
    tipo: "gateway"
    core: true
    red:
      ip: "192.168.1.30/24"

  - nombre: "makima-core"
    estado: "presente"
    tipo: "fisico"
    core: true
    red:
      ip: "192.168.1.20/24"
    firewall_externo:
      - puerto: 8006
        protocolo: "tcp"
        descripcion: "Proxmox GUI"

  - nombre: "reze-core"
    estado: "presente"
    tipo: "fisico"
    core: true
    red:
      ip: "192.168.1.10/24"
    firewall_externo:
      - puerto: 8006
        protocolo: "tcp"
        descripcion: "Proxmox GUI"

  # === MONITOREO - GRAFANA ON ===
  # TEST: monitor_enabled=true, con Grafana y VictoriaMetrics activos y expuestos.

  - nombre: "eve-monitor"
    estado: "presente"
    tipo: "lxc"
    core: false
    os: "alpine"
    nodo_proxmox: "makima"
    vmid: 300
    monitor_enabled: true
    red:
      ip: "192.168.1.40/24"
      gateway: "192.168.1.30"
    recursos:
      cores: 1
      memoria: 512
      disco: 8
      disco_datos:
        storage: "hdd_data"
        size: "50G"
        mp: "/var/lib/victoria-metrics"
    firewall_externo:
      - puerto: 22
        protocolo: "tcp"
        descripcion: "SSH Admin"
      - puerto: 3000
        protocolo: "tcp"
        descripcion: "Grafana"
      - puerto: 8428
        protocolo: "tcp"
        descripcion: "VictoriaMetrics"

  # === MONITOREO - GRAFANA OFF, PERO monitor_enabled=true EN OTRO NODO ===
  # TEST: dos "monitores" simultáneos (uno alive, otro apagado). El validator
  # ¿detecta que hay un segundo colector con monitor_enabled true apuntando
  # a un eve-monitor secundario que está "ausente"? Dependencia rota.

  - nombre: "eve-monitor-b"
    estado: "ausente"
    tipo: "lxc"
    core: false
    os: "alpine"
    nodo_proxmox: "reze"
    vmid: 301
    monitor_enabled: false
    red:
      ip: "192.168.1.45/24"
      gateway: "192.168.1.30"
    recursos:
      cores: 1
      memoria: 512
      disco: 8
    # TEST: sin firewall_externo en un recurso "ausente" -> ¿el validator
    # se queja aunque el nodo no exista, o solo valida recursos "presente"?

  # === VMs EFÍMERAS (varias, para saturar el nodo) ===

  - nombre: "eve-lab-vm"
    estado: "presente"
    tipo: "vm"
    core: false
    efimero: true
    monitor_enabled: true
    nodo_proxmox: "makima"
    vmid: 100
    plantilla: "debian13-template"
    red:
      ip: "192.168.1.41/24"
      gateway: "192.168.1.30"
    recursos:
      cores: 2
      memoria: 1024
      disco: 20
    firewall_externo:
      - puerto: 22
        protocolo: "tcp"
        descripcion: "SSH Admin"

  - nombre: "stress-vm-web01"
    estado: "presente"
    tipo: "vm"
    core: false
    efimero: true
    monitor_enabled: true
    nodo_proxmox: "makima"
    vmid: 101
    plantilla: "debian13-template"
    servicio: "nginx"
    red:
      ip: "192.168.1.101/24"
      gateway: "192.168.1.30"
    recursos:
      cores: 2
      memoria: 2048
      disco: 20
    # TEST: sin firewall_externo -> web server sin puerto 80/443 declarado.
    # ¿El validator lo marca como "recurso huérfano sin exposición" o lo ignora?

  - nombre: "stress-vm-web02"
    estado: "presente"
    tipo: "vm"
    core: false
    efimero: true
    monitor_enabled: false
    nodo_proxmox: "reze"
    vmid: 102
    plantilla: "debian13-template"
    servicio: "nginx"
    red:
      ip: "192.168.1.101/24"   # TEST: IP DUPLICADA con stress-vm-web01
      gateway: "192.168.1.30"
    recursos:
      cores: 2
      memoria: 2048
      disco: 20
    firewall_externo:
      - puerto: 80
        protocolo: "tcp"
        descripcion: "HTTP"

  - nombre: "stress-vm-api"
    estado: "presente"
    tipo: "vm"
    core: false
    efimero: true
    monitor_enabled: true
    nodo_proxmox: "makima"
    vmid: 100   # TEST: VMID DUPLICADO con eve-lab-vm (mismo nodo)
    plantilla: "debian13-template"
    servicio: "api-python"
    red:
      ip: "192.168.1.103/24"
      gateway: "192.168.1.30"
    recursos:
      cores: 4
      memoria: 4096
      disco: 30
    firewall_externo:
      - puerto: 8000
        protocolo: "tcp"
        descripcion: "API REST"

  # === VMs PERSISTENTES (con disco de datos, no efímeras) ===

  - nombre: "stress-vm-db"
    estado: "presente"
    tipo: "vm"
    core: false
    efimero: false
    monitor_enabled: true
    nodo_proxmox: "reze"
    vmid: 110
    plantilla: "debian13-template"
    servicio: "postgresql"
    red:
      ip: "192.168.1.110/24"
      gateway: "192.168.1.30"
    recursos:
      cores: 4
      memoria: 8192
      disco: 40
      disco_datos:
        storage: "hdd_data"
        size: "200G"
        mp: "/var/lib/postgresql"
    # TEST: sin firewall_externo -> DB persistente totalmente cerrada
    # al exterior. ¿Es esto un pase silencioso o el validator exige
    # al menos SSH admin en todo recurso "presente"?

  - nombre: "stress-vm-db-replica"
    estado: "presente"
    tipo: "vm"
    core: false
    efimero: true          # TEST: contradicción -> réplica de DB marcada
                            # como efímera pero con disco_datos persistente.
                            # ¿El janitor la borraría destruyendo datos?
    monitor_enabled: true
    nodo_proxmox: "makima"
    vmid: 111
    plantilla: "debian13-template"
    servicio: "postgresql-replica"
    red:
      ip: "192.168.1.111/24"
      gateway: "192.168.1.30"
    recursos:
      cores: 2
      memoria: 4096
      disco: 20
      disco_datos:
        storage: "hdd_data"
        size: "200G"
        mp: "/var/lib/postgresql"
    firewall_externo:
      - puerto: 5432
        protocolo: "tcp"
        descripcion: "Postgres replication"

  # === LXCs EFÍMEROS (containers ligeros, servicios variados) ===

  - nombre: "eve-lab-lxc"
    estado: "presente"
    tipo: "lxc"
    core: false
    efimero: true
    monitor_enabled: true
    os: "alpine"
    nodo_proxmox: "reze"
    vmid: 200
    red:
      ip: "192.168.1.42/24"
      gateway: "192.168.1.30"
    recursos:
      cores: 1
      memoria: 256
      disco: 4
    firewall_externo:
      - puerto: 22
        protocolo: "tcp"
        descripcion: "SSH Admin"

  - nombre: "stress-lxc-redis"
    estado: "presente"
    tipo: "lxc"
    core: false
    efimero: true
    monitor_enabled: true
    os: "alpine"
    nodo_proxmox: "reze"
    vmid: 201
    servicio: "redis"
    red:
      ip: "192.168.1.201/24"
      gateway: "192.168.1.30"
    recursos:
      cores: 1
      memoria: 512
      disco: 4
    # TEST: sin firewall_externo -> redis solo accesible interno,
    # correcto por diseño. Sirve de "control" (caso válido sin firewall).

  - nombre: "stress-lxc-mailhog"
    estado: "presente"
    tipo: "lxc"
    core: false
    efimero: true
    monitor_enabled: false
    os: "debian"
    nodo_proxmox: "makima"
    vmid: 202
    servicio: "mailhog"
    red:
      ip: "192.168.1.202/24"
      gateway: "192.168.1.99"   # TEST: gateway apunta a IP que no es doom-gateway
    recursos:
      cores: 1
      memoria: 256
      disco: 4
    firewall_externo:
      - puerto: 8025
        protocolo: "tcp"
        descripcion: "MailHog UI"

  # === LXC PERSISTENTE con recursos sobredimensionados ===
  # TEST: saturar el nodo "reze" en memoria/cores para ver si el validator
  # suma recursos por nodo y detecta sobre-asignación.

  - nombre: "stress-lxc-fileserver"
    estado: "presente"
    tipo: "lxc"
    core: false
    efimero: false
    monitor_enabled: true
    os: "debian"
    nodo_proxmox: "reze"
    vmid: 203
    servicio: "samba"
    red:
      ip: "192.168.1.203/24"
      gateway: "192.168.1.30"
    recursos:
      cores: 8
      memoria: 16384
      disco: 20
      disco_datos:
        storage: "hdd_data"
        size: "2T"
        mp: "/srv/samba"
    firewall_externo:
      - puerto: 445
        protocolo: "tcp"
        descripcion: "SMB"
      - puerto: 139
        protocolo: "tcp"
        descripcion: "NetBIOS"

  # === CASO LÍMITE: recurso "presente", core:false, SIN os/plantilla ===
  # TEST: campo obligatorio faltante (ni os ni plantilla). ¿El validator
  # rechaza el build o asume un default silencioso?

  - nombre: "stress-orphan-novalue"
    estado: "presente"
    tipo: "lxc"
    core: false
    efimero: true
    monitor_enabled: false
    nodo_proxmox: "makima"
    vmid: 204
    red:
      ip: "192.168.1.204/24"
      gateway: "192.168.1.30"
    recursos:
      cores: 1
      memoria: 128
      disco: 2
    # sin firewall_externo intencional -> tercer caso de "silencio" a probar

  # === CASO LÍMITE: estado desconocido, no "presente" ni "ausente" ===
  # TEST: valor de enum inválido para ver si el parser explota o lo ignora.

  - nombre: "stress-bad-estado"
    estado: "reiniciando"
    tipo: "vm"
    core: false
    efimero: true
    monitor_enabled: false
    nodo_proxmox: "reze"
    vmid: 205
    plantilla: "debian13-template"
    red:
      ip: "192.168.1.205/24"
      gateway: "192.168.1.30"
    recursos:
      cores: 1
      memoria: 512
      disco: 10
    firewall_externo:
      - puerto: 22
        protocolo: "tcp"
        descripcion: "SSH Admin"
