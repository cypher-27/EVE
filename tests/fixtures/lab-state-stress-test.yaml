# ==========================================
# EVE - Stress-test fixture for validator.collect_errors()
# Each block below triggers ONE specific validation rule. Loaded
# automatically by tests/test_validator.py
# (test_full_stress_fixture_matches_expected_error_count), which
# asserts all 24 errors below appear together in a single
# collect_errors() call.
# ==========================================

entornos:

  # === CORE INFRASTRUCTURE (needed so gateway_ips isn't empty) ===
  - nombre: "doom-gateway"
    estado: "presente"
    tipo: "gateway"
    core: true
    red:
      ip: "192.168.1.30/24"

  - nombre: "makima-core"
    estado: "presente"
    tipo: "fisico"
    core: true
    red:
      ip: "192.168.1.20/24"

  - nombre: "reze-core"
    estado: "presente"
    tipo: "fisico"
    core: true
    red:
      ip: "192.168.1.10/24"

  # === CASE 1: IP out of range (.41-.63) ===
  - nombre: "stress-ip-range"
    estado: "presente"
    tipo: "vm"
    nodo_proxmox: "makima"
    vmid: 501
    plantilla: "debian13-template"
    red: { ip: "192.168.1.101/24", gateway: "192.168.1.30" }
    recursos: { cores: 1, memoria: 512, disco: 11 }

  # === CASE 2: Duplicate IP (same .50 on both) ===
  - nombre: "stress-dup-ip-a"
    estado: "presente"
    tipo: "lxc"
    os: "alpine"
    nodo_proxmox: "reze"
    vmid: 502
    red: { ip: "192.168.1.50/24", gateway: "192.168.1.30" }
    recursos: { cores: 1, memoria: 256, disco: 2 }

  - nombre: "stress-dup-ip-b"
    estado: "presente"
    tipo: "lxc"
    os: "alpine"
    nodo_proxmox: "reze"
    vmid: 503
    red: { ip: "192.168.1.50/24", gateway: "192.168.1.30" }
    recursos: { cores: 1, memoria: 256, disco: 2 }

  # === CASE 3: Duplicate VMID (600 on both) ===
  - nombre: "stress-dup-vmid-a"
    estado: "presente"
    tipo: "lxc"
    os: "alpine"
    nodo_proxmox: "reze"
    vmid: 600
    red: { ip: "192.168.1.41/24", gateway: "192.168.1.30" }
    recursos: { cores: 1, memoria: 256, disco: 2 }

  - nombre: "stress-dup-vmid-b"
    estado: "presente"
    tipo: "lxc"
    os: "alpine"
    nodo_proxmox: "reze"
    vmid: 600
    red: { ip: "192.168.1.42/24", gateway: "192.168.1.30" }
    recursos: { cores: 1, memoria: 256, disco: 2 }

  # === CASE 4: Storage pool doesn't exist on the node (hdd_data on reze) ===
  - nombre: "stress-storage-missing"
    estado: "presente"
    tipo: "lxc"
    os: "alpine"
    nodo_proxmox: "reze"
    vmid: 504
    red: { ip: "192.168.1.43/24", gateway: "192.168.1.30" }
    recursos:
      cores: 1
      memoria: 256
      disco: 2
      disco_datos: { storage: "hdd_data", size: "5G", mp: "/data" }

  # === CASE 5: Invalid size format (2T, T unit not supported) ===
  - nombre: "stress-bad-size"
    estado: "presente"
    tipo: "lxc"
    os: "alpine"
    nodo_proxmox: "makima"
    vmid: 505
    red: { ip: "192.168.1.44/24", gateway: "192.168.1.30" }
    recursos:
      cores: 1
      memoria: 256
      disco: 2
      disco_datos: { storage: "hdd_data", size: "2T", mp: "/data" }

  # === CASE 6: LXC missing 'os' field ===
  - nombre: "stress-missing-os"
    estado: "presente"
    tipo: "lxc"
    nodo_proxmox: "makima"
    vmid: 506
    red: { ip: "192.168.1.45/24", gateway: "192.168.1.30" }
    recursos: { cores: 1, memoria: 256, disco: 4 }

  # === CASE 7: Disk too small for the OS (debian min 4G) ===
  - nombre: "stress-small-disk-os"
    estado: "presente"
    tipo: "lxc"
    os: "debian"
    nodo_proxmox: "makima"
    vmid: 507
    red: { ip: "192.168.1.46/24", gateway: "192.168.1.30" }
    recursos: { cores: 1, memoria: 256, disco: 2 }

  # === CASE 8: Disk smaller than the template's minimum (debian13-template = 11G) ===
  - nombre: "stress-small-disk-template"
    estado: "presente"
    tipo: "vm"
    nodo_proxmox: "makima"
    vmid: 508
    plantilla: "debian13-template"
    red: { ip: "192.168.1.47/24", gateway: "192.168.1.30" }
    recursos: { cores: 1, memoria: 512, disco: 10 }

  # === CASE 9: RAM and CPU overbooking (single resource triggers both) ===
  - nombre: "stress-ram-cpu-blowout"
    estado: "presente"
    tipo: "vm"
    nodo_proxmox: "makima"
    vmid: 509
    plantilla: "debian13-template"
    red: { ip: "192.168.1.48/24", gateway: "192.168.1.30" }
    recursos: { cores: 50, memoria: 20000, disco: 12 }

  # === CASE 10: Ephemeral RAM budget exceeded (cap 2048MB) ===
  - nombre: "stress-ephemeral-ram"
    estado: "presente"
    tipo: "vm"
    efimero: true
    nodo_proxmox: "makima"
    vmid: 510
    plantilla: "debian13-template"
    red: { ip: "192.168.1.49/24", gateway: "192.168.1.30" }
    recursos: { cores: 1, memoria: 3000, disco: 12 }

  # === CASE 11: estado has a typo, neither 'presente' nor 'ausente' ===
  - nombre: "stress-bad-estado"
    estado: "reiniciando"
    tipo: "lxc"
    os: "alpine"
    nodo_proxmox: "makima"
    vmid: 511
    red: { ip: "192.168.1.51/24", gateway: "192.168.1.30" }
    recursos: { cores: 1, memoria: 256, disco: 2 }

  # === CASE 12: gateway doesn't match any tipo:gateway node ===
  - nombre: "stress-bad-gateway"
    estado: "presente"
    tipo: "lxc"
    os: "alpine"
    nodo_proxmox: "makima"
    vmid: 512
    red: { ip: "192.168.1.52/24", gateway: "192.168.1.99" }
    recursos: { cores: 1, memoria: 256, disco: 2 }

  # === CASE 13: Invalid IP format ===
  - nombre: "stress-invalid-ip"
    estado: "presente"
    tipo: "lxc"
    os: "alpine"
    nodo_proxmox: "makima"
    vmid: 513
    red: { ip: "999.999.999.999/24", gateway: "192.168.1.30" }
    recursos: { cores: 1, memoria: 256, disco: 2 }

  # === CASE 14: Unknown Proxmox node ===
  - nombre: "stress-unknown-node"
    estado: "presente"
    tipo: "lxc"
    os: "alpine"
    nodo_proxmox: "reze2"
    vmid: 514
    red: { ip: "192.168.1.53/24", gateway: "192.168.1.30" }
    recursos: { cores: 1, memoria: 256, disco: 2 }

  # === CASE 15: Missing the entire 'recursos' block ===
  - nombre: "stress-missing-recursos"
    estado: "presente"
    tipo: "vm"
    nodo_proxmox: "makima"
    vmid: 515
    plantilla: "debian13-template"
    red: { ip: "192.168.1.54/24", gateway: "192.168.1.30" }

  # === CASE 16: VM missing 'plantilla' field ===
  - nombre: "stress-vm-no-plantilla"
    estado: "presente"
    tipo: "vm"
    nodo_proxmox: "makima"
    vmid: 516
    red: { ip: "192.168.1.55/24", gateway: "192.168.1.30" }
    recursos: { cores: 1, memoria: 512, disco: 12 }

  # === CASE 17: LXC missing 'vmid' ===
  - nombre: "stress-lxc-no-vmid"
    estado: "presente"
    tipo: "lxc"
    os: "alpine"
    nodo_proxmox: "makima"
    red: { ip: "192.168.1.56/24", gateway: "192.168.1.30" }
    recursos: { cores: 1, memoria: 256, disco: 2 }

  # === CASE 18: Unknown VM template (not registered in LIMITS) ===
  - nombre: "stress-unknown-template"
    estado: "presente"
    tipo: "vm"
    nodo_proxmox: "makima"
    vmid: 517
    plantilla: "windows11-template"
    red: { ip: "192.168.1.57/24", gateway: "192.168.1.30" }
    recursos: { cores: 1, memoria: 512, disco: 20 }

  # === CASE 19: Invalid firewall protocol ===
  - nombre: "stress-invalid-protocol"
    estado: "presente"
    tipo: "lxc"
    os: "alpine"
    nodo_proxmox: "makima"
    vmid: 518
    red: { ip: "192.168.1.58/24", gateway: "192.168.1.30" }
    recursos: { cores: 1, memoria: 256, disco: 2 }
    firewall_externo:
      - { puerto: 22, protocolo: "icmp", descripcion: "Badly declared SSH" }

  # === CASE 20: Port outside the valid range ===
  - nombre: "stress-invalid-port"
    estado: "presente"
    tipo: "lxc"
    os: "alpine"
    nodo_proxmox: "makima"
    vmid: 519
    red: { ip: "192.168.1.59/24", gateway: "192.168.1.30" }
    recursos: { cores: 1, memoria: 256, disco: 2 }
    firewall_externo:
      - { puerto: 99999, protocolo: "tcp", descripcion: "Impossible port" }

  # === CASE 21: Requests monitoring, but eve-monitor isn't declared 'presente' ===
  - nombre: "stress-monitor-request"
    estado: "presente"
    tipo: "lxc"
    os: "alpine"
    monitor_enabled: true
    nodo_proxmox: "makima"
    vmid: 520
    red: { ip: "192.168.1.60/24", gateway: "192.168.1.30" }
    recursos: { cores: 1, memoria: 256, disco: 2 }

  # === CASE 22: Duplicate name (same 'nombre' on two resources) ===
  - nombre: "stress-dup-name"
    estado: "presente"
    tipo: "lxc"
    os: "alpine"
    nodo_proxmox: "makima"
    vmid: 522
    red: { ip: "192.168.1.62/24", gateway: "192.168.1.30" }
    recursos: { cores: 1, memoria: 256, disco: 2 }

  - nombre: "stress-dup-name"
    estado: "presente"
    tipo: "lxc"
    os: "alpine"
    nodo_proxmox: "makima"
    vmid: 523
    red: { ip: "192.168.1.63/24", gateway: "192.168.1.30" }
    recursos: { cores: 1, memoria: 256, disco: 2 }

  # === CONTROL: 100% valid resource, must pass with zero errors ===
  - nombre: "stress-valid-control"
    estado: "presente"
    tipo: "lxc"
    os: "alpine"
    nodo_proxmox: "reze"
    vmid: 521
    red: { ip: "192.168.1.61/24", gateway: "192.168.1.30" }
    recursos: { cores: 1, memoria: 256, disco: 2 }
    firewall_externo:
      - { puerto: 22, protocolo: "tcp", descripcion: "SSH Admin" }
