## Fase 1
- name: "Fase 1: Descubrimiento de Nodos para el Espejo"
  hosts: localhost
  connection: local
  tasks:
    - name: "Leer contrato maestro"
      include_vars:
        file: "../../lab-state.yaml"
        name: contrato

    - name: "Poblar inventario dinámico"
      add_host:
        name: "{{ item.nombre }}"
        groups: "{{ 'eve_monitor_group' if item.nombre == 'eve-monitor' else 'targets_to_monitor' }}"
        ansible_host: "{{ item.red.ip.split('/')[0] }}"
        ansible_user: "root"
        ansible_ssh_private_key_file: "~/.ssh/eve_admin"
        ansible_ssh_common_args: "-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null"
      loop: "{{ contrato.entornos }}"
      when: item.estado == 'presente' and item.tipo in ['vm', 'lxc']

## Fase 2
- name: "Fase 2.6: Configuración del Espejo (Observabilidad)"
  hosts: eve-monitor
  become: yes
  gather_facts: true

  vars:
    secretos: "{{ lookup('community.sops.sops', '../../secrets.enc.yaml') | from_yaml }}"

  tasks:
    - name: "0. Leer contrato para el Scrape (lab_state)"
      ansible.builtin.include_vars:
        file: "../../lab-state.yaml"
        name: lab_state

    - name: "1. Instalar VictoriaMetrics y Grafana"
      community.general.apk:
        name: [victoria-metrics, grafana]
        update_cache: yes
        state: present

    - name: "2. FIX: Crear estructura de carpetas (Alpine Fix)"
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        owner: root
        group: grafana
        mode: '0755'
      loop:
        - /var/lib/victoria-metrics
        - /etc/grafana/provisioning/datasources
        - /etc/grafana/provisioning/dashboards

    - name: "3. FIX: Permisos HDD para VictoriaMetrics"
      ansible.builtin.file:
        path: /var/lib/victoria-metrics
        state: directory
        owner: nobody
        group: nobody
        mode: '0775'

    - name: "4. Generar Archivos de Configuración"
      ansible.builtin.template:
        src: "{{ item.src }}"
        dest: "{{ item.dest }}"
        owner: root
        group: "{{ item.group | default('root') }}"
        mode: '0644'
      loop:
        - { src: 'scrape.yml.j2', dest: '/etc/victoria-metrics-scrape.yml', group: 'nobody' }
        - { src: 'victoria-metrics-opts.j2', dest: '/etc/conf.d/victoria-metrics' }
      notify: Restart VictoriaMetrics

    - name: "5. Configurar Grafana (.ini y Provisioning Path)"
      ansible.builtin.lineinfile:
        path: /etc/grafana.ini
        regexp: "{{ item.regexp }}"
        line: "{{ item.line }}"
      loop:
        - { regexp: '^;admin_password =', line: "admin_password = {{ secretos.grafana_admin_password }}" }
        - { regexp: '127.0.0.1', line: 'grafana_opts="--cfg:server.http_addr=0.0.0.0"' }
        # Le decimos explícitamente a Grafana donde buscar el provisioning
        - { regexp: '^;provisioning =', line: 'provisioning = /etc/grafana/provisioning' }
      no_log: true

    - name: "6. Inyectar Data Source (Auto-connect)"
      ansible.builtin.copy:
        dest: /etc/grafana/provisioning/datasources/victoria-metrics.yaml
        content: |
          apiVersion: 1
          datasources:
            - name: VictoriaMetrics
              type: prometheus
              url: http://127.0.0.1:8428
              access: proxy
              isDefault: true
              editable: true
        owner: root
        group: grafana
        mode: '0640'
      notify: Restart Grafana

    - name: "7. Iniciar y habilitar servicios"
      ansible.builtin.service:
        name: "{{ item }}"
        state: started
        enabled: yes
      loop: [victoria-metrics, grafana]

    # --- PROVISIONING DE DASHBOARDS ---
    - name: "7.1 Configurar el Provider de Dashboards"
      ansible.builtin.template:
        src: dashboard-provider.yml.j2
        dest: /etc/grafana/provisioning/dashboards/eve-provider.yaml
        owner: root
        group: grafana
        mode: '0640'
      notify: Restart Grafana

    - name: "7.2 Inyectar JSON del Dashboard Maestro"
      ansible.builtin.copy:
        src: files/node-exporter-dash.json
        dest: /etc/grafana/provisioning/dashboards/node-exporter-dash.json
        owner: root
        group: grafana
        mode: '0640'
      notify: Restart Grafana

  handlers:
    - name: Restart VictoriaMetrics
      ansible.builtin.service:
        name: victoria-metrics
        state: restarted
    - name: Restart Grafana
      ansible.builtin.service:
        name: grafana
        state: restarted
