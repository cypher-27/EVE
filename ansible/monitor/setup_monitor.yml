## Phase 1
- name: "Phase 1: Node Discovery for the Mirror"
  hosts: localhost
  connection: local
  tasks:
    - name: "Read master contract"
      include_vars:
        file: "../../lab-state.yaml"
        name: contrato

    - name: "Populate dynamic inventory"
      add_host:
        name: "{{ item.nombre }}"
        groups: "{{ 'eve_monitor_group' if item.nombre == 'eve-monitor' else 'targets_to_monitor' }}"
        ansible_host: "{{ item.red.ip.split('/')[0] }}"
        ansible_user: "root"
        ansible_ssh_private_key_file: "~/.ssh/eve_admin"
        ansible_ssh_common_args: "-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null"
      loop: "{{ contrato.entornos }}"
      when: item.estado == 'presente' and item.tipo in ['vm', 'lxc']

## Phase 2
- name: "Phase 2.6: Mirror Configuration (Observability)"
  hosts: eve-monitor
  become: yes
  gather_facts: true

  vars:
    secrets: "{{ lookup('community.sops.sops', '../../secrets.enc.yaml') | from_yaml }}"

  tasks:
    - name: "0. Read contract for the Scrape config (lab_state)"
      ansible.builtin.include_vars:
        file: "../../lab-state.yaml"
        name: lab_state

    - name: "1. Install VictoriaMetrics and Grafana"
      community.general.apk:
        name: [victoria-metrics, grafana]
        update_cache: yes
        state: present

    - name: "2. Create Victoria and Grafana directories"
      ansible.builtin.file:
        path: "{{ item.path }}"
        state: directory
        owner: "{{ item.owner }}"
        group: "{{ item.group }}"
        mode: '0755'
      loop:
        - { path: '/var/lib/victoria-metrics', owner: 'victoriametrics', group: 'victoriametrics' }
        - { path: '/var/lib/grafana/provisioning/datasources', owner: 'grafana', group: 'grafana' }
        - { path: '/var/lib/grafana/provisioning/dashboards', owner: 'grafana', group: 'grafana' }

    - name: "3. Generate VictoriaMetrics Configuration Files"
      ansible.builtin.template:
        src: "{{ item.src }}"
        dest: "{{ item.dest }}"
        owner: root
        group: "{{ item.group | default('root') }}"
        mode: '0644'
      loop:
        - { src: 'scrape.yml.j2', dest: '/etc/victoria-metrics-scrape.yml', group: 'victoriametrics' }
        - { src: 'victoria-metrics-opts.j2', dest: '/etc/conf.d/victoria-metrics' }
      notify: Restart VictoriaMetrics

    - name: "4. Inject Grafana Password"
      ansible.builtin.lineinfile:
        path: /etc/grafana.ini
        regexp: '^;admin_password ='
        # We use the 'secrets' object loaded from the encrypted YAML
        line: "admin_password = {{ secrets.grafana_admin_password }}"
        owner: "root"
        group: "grafana"
        mode: "0640"
      no_log: true

    - name: "4.1 Force Grafana to listen on all interfaces"
      ansible.builtin.lineinfile:
        path: /etc/conf.d/grafana
        regexp: '127.0.0.1'
        line: 'grafana_opts="--cfg:server.http_addr=0.0.0.0"'
      notify: Restart Grafana

    - name: "5. Inject Data Source (Alpine Path)"
      ansible.builtin.copy:
        dest: /var/lib/grafana/provisioning/datasources/victoria-metrics.yaml
        content: |
          apiVersion: 1
          datasources:
            - name: VictoriaMetrics
              type: prometheus
              url: http://127.0.0.1:8428
              access: proxy
              isDefault: true
              editable: true
        owner: root
        group: grafana
        mode: '0640'
      notify: Restart Grafana

    - name: "6. Configure Dashboards Provider (Alpine Path)"
      ansible.builtin.template:
        src: dashboard-provider.yml.j2
        dest: /var/lib/grafana/provisioning/dashboards/eve-provider.yaml
        owner: root
        group: grafana
        mode: '0640'
      notify: Restart Grafana

    - name: "7. Inject Master Dashboard JSON"
      ansible.builtin.copy:
        src: files/node-exporter-dash.json
        dest: /var/lib/grafana/provisioning/dashboards/node-exporter-dash.json
        owner: root
        group: grafana
        mode: '0640'
      notify: Restart Grafana

    - name: "7.5 Mutilate 'command_user' to force Root (Alpine LXC Bug)"
      ansible.builtin.lineinfile:
        path: /etc/init.d/victoria-metrics
        regexp: '^command_user='
        line: '#command_user=victoriametrics:victoriametrics # Mutilated by EVE to force Root'
      notify: Restart VictoriaMetrics

    - name: "8. Start and enable services"
      ansible.builtin.service:
        name: "{{ item }}"
        state: started
        enabled: yes
      loop: [victoria-metrics, grafana]

  handlers:
    - name: Restart VictoriaMetrics
      ansible.builtin.service:
        name: victoria-metrics
        state: restarted
    - name: Restart Grafana
      ansible.builtin.service:
        name: grafana
        state: restarted
