## Fase 1
- name: "Fase 1: Descubrimiento de Nodos para el Espejo"
  hosts: localhost
  connection: local
  tasks:
    - name: "Leer contrato maestro"
      include_vars:
        file: "../../lab-state.yaml"
        name: contrato

    - name: "Poblar inventario dinámico"
      add_host:
        name: "{{ item.nombre }}"
        groups: "{{ 'eve_monitor_group' if item.nombre == 'eve-monitor' else 'targets_to_monitor' }}"
        ansible_host: "{{ item.red.ip.split('/')[0] }}"
        ansible_user: "root"
        ansible_ssh_private_key_file: "~/.ssh/eve_admin"
        ansible_ssh_common_args: "-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null"
      loop: "{{ contrato.entornos }}"
      when: item.estado == 'presente' and item.tipo in ['vm', 'lxc']

## Fase 2
- name: "Fase 2.6: Configuración del Espejo (Observabilidad)"
  hosts: eve-monitor
  become: yes
  gather_facts: true

  vars:
    secretos: "{{ lookup('community.sops.sops', '../../secrets.enc.yaml') | from_yaml }}"

  tasks:
    - name: "0. Leer contrato para el Scrape (lab_state)"
      ansible.builtin.include_vars:
        file: "../../lab-state.yaml"
        name: lab_state

    - name: "1. Instalar VictoriaMetrics y Grafana"
      community.general.apk:
        name: [victoria-metrics, grafana]
        update_cache: yes
        state: present

    - name: "2. FIX: Crear directorios de Victoria y Grafana"
      ansible.builtin.file:
        path: "{{ item.path }}"
        state: directory
        owner: "{{ item.owner }}"
        group: "{{ item.group }}"
        mode: '0755'
      loop:
        - { path: '/var/lib/victoria-metrics', owner: 'victoriametrics', group: 'victoriametrics' }
        - { path: '/var/lib/grafana/provisioning/datasources', owner: 'grafana', group: 'grafana' }
        - { path: '/var/lib/grafana/provisioning/dashboards', owner: 'grafana', group: 'grafana' }

    - name: "3. Generar Archivos de Configuración de VictoriaMetrics"
      ansible.builtin.template:
        src: "{{ item.src }}"
        dest: "{{ item.dest }}"
        owner: root
        group: "{{ item.group | default('root') }}"
        mode: '0644'
      loop:
        - { src: 'scrape.yml.j2', dest: '/etc/victoria-metrics-scrape.yml', group: 'victoriametrics' }
        - { src: 'victoria-metrics-opts.j2', dest: '/etc/conf.d/victoria-metrics' }
      notify: Restart VictoriaMetrics

    - name: "4. Configurar Password de Admin en .ini"
      ansible.builtin.lineinfile:
        path: /etc/grafana.ini
        regexp: '^[;#]?\s*admin_password\s*='
        line: "admin_password = {{ secretos.grafana_admin_password }}"
      no_log: true

    - name: "4.1 FIX: Liberar a Grafana de 127.0.0.1 de forma segura (Alpine Override)"
      ansible.builtin.lineinfile:
        path: /etc/conf.d/grafana
        # Buscamos la línea que define las opciones o contiene la IP local
        regexp: '^grafana_opts=.*127\.0\.0\.1'
        # Y la reemplazamos manteniendo la sintaxis original
        line: 'grafana_opts="--cfg:server.http_addr=0.0.0.0"'
      notify: Restart Grafana

    - name: "5. Inyectar Data Source (Ruta de Alpine)"
      ansible.builtin.copy:
        dest: /var/lib/grafana/provisioning/datasources/victoria-metrics.yaml
        content: |
          apiVersion: 1
          datasources:
            - name: VictoriaMetrics
              type: prometheus
              url: http://127.0.0.1:8428
              access: proxy
              isDefault: true
              editable: true
        owner: root
        group: grafana
        mode: '0640'
      notify: Restart Grafana

    - name: "6. Configurar el Provider de Dashboards (Ruta de Alpine)"
      ansible.builtin.template:
        src: dashboard-provider.yml.j2
        dest: /var/lib/grafana/provisioning/dashboards/eve-provider.yaml
        owner: root
        group: grafana
        mode: '0640'
      notify: Restart Grafana

    - name: "7. Inyectar JSON del Dashboard Maestro"
      ansible.builtin.copy:
        src: files/node-exporter-dash.json
        dest: /var/lib/grafana/provisioning/dashboards/node-exporter-dash.json
        owner: root
        group: grafana
        mode: '0640'
      notify: Restart Grafana

    - name: "7.5 FIX: Mutilar 'command_user' para forzar Root (Bug Alpine LXC)"
      ansible.builtin.lineinfile:
        path: /etc/init.d/victoria-metrics
        regexp: '^command_user='
        line: '#command_user=victoriametrics:victoriametrics # Mutilado por EVE para forzar Root'
      notify: Restart VictoriaMetrics

    - name: "8. Iniciar y habilitar servicios"
      ansible.builtin.service:
        name: "{{ item }}"
        state: started
        enabled: yes
      loop: [victoria-metrics, grafana]

  handlers:
    - name: Restart VictoriaMetrics
      ansible.builtin.service:
        name: victoria-metrics
        state: restarted
    - name: Restart Grafana
      ansible.builtin.service:
        name: grafana
        state: restarted
