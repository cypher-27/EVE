---
# ==============================================================================
# PLAY 1: Cargar el SSOT y crear el Inventario Multimodal (SDDC)
# ==============================================================================
- name: "Fase 1: Generar Inventario Dinámico Multimodal desde SSOT"
  hosts: localhost
  connection: local
  gather_facts: false

  vars:
    path_to_contract: "{{ playbook_dir }}/../../lab-state.yaml"

  tasks:
    - name: "1.1 Leer el contrato maestro (lab-state.yaml)"
      ansible.builtin.include_vars:
        file: "{{ path_to_contract }}"
        name: contrato

    - name: "1.2 Clasificar hosts y evadir SSH Fingerprint"
      ansible.builtin.add_host:
        name: "{{ item.nombre }}"
        groups:
          - "eve_dynamic_nodes"
          - "type_{{ item.tipo | default('vm') }}"
        ansible_host: "{{ item.red.ip.split('/')[0] }}"
        # Si es VM usa 'admin', si es LXC usa 'root'
        ansible_user: "{{ 'admin' if (item.tipo | default('vm')) == 'vm' else 'root' }}"
        ansible_ssh_private_key_file: "~/.ssh/eve_admin"
        ansible_ssh_common_args: "-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o CheckHostIP=no"
      loop: "{{ contrato.entornos }}"
      when:
        - item.estado == "presente"
        - item.tipo in ['vm', 'lxc']

# ==============================================================================
# PLAY 2: Configuración Base (Distribuida por tipos)
# ==============================================================================
- name: "Fase 2: Ejecución de Configuración Base"
  hosts: type_vm:type_lxc
  become: yes
  gather_facts: false

  vars:
    lab_state: "{{ lookup('file', '../../lab-state.yaml') | from_yaml }}"

  pre_tasks:
    - name: "Bootstrap: Instalar Python en Alpine (vía RAW)"
      ansible.builtin.raw: apk add --no-cache python3
      changed_when: false
      when:
        - "'type_lxc' in group_names"
      failed_when: false

    - name: "Recolectar Facts ahora que Python existe"
      ansible.builtin.setup:

  tasks:
    - name: "2.0 Determinar si el monitoreo está habilitado"
      set_fact:
        is_monitored: >-
          {{ lab_state.entornos
             | selectattr('red.ip', 'defined')
             | selectattr('nombre', 'equalto', inventory_hostname)
             | map(attribute='monitor_enabled')
             | first | default(false) }}

    - name: "2.1 Test de Conexión (Sin Sudo)"
      ansible.builtin.ping:
      become: no

    # --- LÓGICA MULTI-OS ---
    - name: "2.2 Actualizar repositorios y sistema (Debian)"
      ansible.builtin.apt:
        update_cache: yes
        upgrade: dist
      when: ansible_os_family == "Debian"

    - name: "2.2 Actualizar repositorios y sistema (Alpine)"
      community.general.apk:
        update_cache: yes
        upgrade: yes
      when: ansible_os_family == "Alpine"

    - name: "2.3 Instalar dependencias globales"
      ansible.builtin.package:
        name:
          - curl
          - git
          - vim
          - htop
        state: present

    # --- EXCLUSIVO PARA VMs ---
    - name: "2.4 Instalar y habilitar QEMU Guest Agent (SOLO VMs)"
      block:
        - name: "Instalar QEMU Agent"
          ansible.builtin.apt:
            name: qemu-guest-agent
            state: present
        - name: "Iniciar servicio QEMU Agent"
          ansible.builtin.systemd:
            name: qemu-guest-agent
            state: started
            enabled: yes
      when:
        - "'type_vm' in group_names"
        - "ansible_os_family == 'Debian'"

    # --- MONITOREO (respeta monitor_enabled del lab-state.yaml) ---
    - name: "2.5 Instalar Node Exporter"
      ansible.builtin.package:
        name: "prometheus-node-exporter"
        state: present
      when: is_monitored | default(false) | bool

    - name: "2.6 Asegurar que Node Exporter esté corriendo"
      ansible.builtin.service:
        # Debian -> prometheus-node-exporter
        # Alpine -> node-exporter
        name: "{{ 'node-exporter' if ansible_os_family == 'Alpine' else 'prometheus-node-exporter' }}"
        state: started
        enabled: yes
      when: is_monitored | default(false) | bool
