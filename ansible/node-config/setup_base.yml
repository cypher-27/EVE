---
# ==============================================================================
# PLAY 1: Cargar el SSOT y crear el Inventario Multimodal (SDDC)
# ==============================================================================
- name: "Fase 1: Generar Inventario Dinámico Multimodal desde SSOT"
  hosts: localhost
  connection: local
  gather_facts: false

  vars:
    path_to_contract: "{{ playbook_dir }}/../../lab-state.yaml"

  tasks:
    - name: "1.1 Leer el contrato maestro (lab-state.yaml)"
      ansible.builtin.include_vars:
        file: "{{ path_to_contract }}"
        name: contrato

    - name: "1.2 Clasificar hosts y evadir SSH Fingerprint"
      ansible.builtin.add_host:
        name: "{{ item.nombre }}"
        groups:
          - "eve_dynamic_nodes"
          - "type_{{ item.tipo | default('vm') }}" # Magia pura: type_vm, type_lxc, type_fisico
        ansible_host: "{{ item.red.ip.split('/')[0] }}"
        ansible_user: "admin"
        ansible_ssh_private_key_file: "~/.ssh/eve_admin"
        # Tu aporte: Bypass de seguridad para máquinas recién nacidas
        ansible_ssh_common_args: "-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o CheckHostIP=no"
      loop: "{{ contrato.entornos }}"
      # Solo parseamos los que existen, sin importar su tipo
      when: item.estado == "presente"

# ==============================================================================
# PLAY 2: Configuración Base (Distribuida por tipos)
# ==============================================================================
- name: "Fase 2: Ejecución de Configuración Base"
  # Target: Todos los nodos dinámicos EXCEPTO los físicos (Makima/Reze) para no romper Proxmox
  hosts: eve_dynamic_nodes:!type_fisico
  become: yes
  gather_facts: true

  tasks:
    - name: "2.0 Test de Conexión (Sin Sudo)"
      ansible.builtin.ping:
      become: no # Probamos primero si podemos entrar sin ser root

    - name: "2.1 Actualizar repositorios y sistema"
      apt:
        update_cache: yes
        upgrade: dist

    - name: "2.2 Instalar dependencias globales (Aplica a VMs y LXCs)"
      apt:
        name:
          - curl
          - git
          - vim
          - htop
        state: present

    # Esta tarea es exclusiva para las Máquinas Virtuales (Ignora LXCs)
    - name: "2.3 Instalar y habilitar QEMU Guest Agent (SOLO VMs)"
      block:
        - name: "Instalar QEMU Agent"
          apt:
            name: qemu-guest-agent
            state: present
        - name: "Iniciar servicio QEMU Agent"
          systemd:
            name: qemu-guest-agent
            state: started
            enabled: yes
      # Condición dinámica basada en el grupo que creaste
      when: "'type_vm' in group_names"
