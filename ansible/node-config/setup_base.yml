---
# ==============================================================================
# PLAY 1: Load the SSOT and build the Multimodal Inventory (SDDC)
# ==============================================================================
- name: "Phase 1: Generate Dynamic Multimodal Inventory from SSOT"
  hosts: localhost
  connection: local
  gather_facts: false

  vars:
    path_to_contract: "{{ playbook_dir }}/../../lab-state.yaml"

  tasks:
    - name: "1.1 Read the master contract (lab-state.yaml)"
      ansible.builtin.include_vars:
        file: "{{ path_to_contract }}"
        name: contrato

    - name: "1.2 Classify hosts and bypass SSH Fingerprint"
      ansible.builtin.add_host:
        name: "{{ item.nombre }}"
        groups:
          - "eve_dynamic_nodes"
          - "type_{{ item.tipo | default('vm') }}"
        ansible_host: "{{ item.red.ip.split('/')[0] }}"
        # If it's a VM use 'admin', if it's an LXC use 'root'
        ansible_user: "{{ 'admin' if (item.tipo | default('vm')) == 'vm' else 'root' }}"
        ansible_ssh_private_key_file: "~/.ssh/eve_admin"
        ansible_ssh_common_args: "-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o CheckHostIP=no"
      loop: "{{ contrato.entornos }}"
      when:
        - item.estado == "presente"
        - item.tipo in ['vm', 'lxc']

# ==============================================================================
# PLAY 2: Base Configuration (Distributed by type)
# ==============================================================================
- name: "Phase 2: Base Configuration Execution"
  hosts: type_vm:type_lxc
  become: yes
  gather_facts: false

  vars:
    lab_state: "{{ lookup('file', '../../lab-state.yaml') | from_yaml }}"

  pre_tasks:
    - name: "Wait for the host to accept a real SSH connection (without depending on Python)"
      # NOTE: wait_for_connection internally uses the 'ping' module, which
      # requires Python on the remote host. That breaks Alpine because Python
      # isn't installed yet at this point — a circular dependency. 'raw'
      # doesn't need an interpreter, so it works as a real pre-flight check.
      ansible.builtin.raw: echo ready
      register: ssh_ready
      retries: 12
      delay: 10
      until: ssh_ready is succeeded
      changed_when: false

    - name: "Bootstrap: Install Python on Alpine (via RAW, with real retries)"
      ansible.builtin.raw: apk update && apk add --no-cache python3 && which python3
      register: bootstrap_result
      retries: 5
      delay: 10
      until: bootstrap_result.rc == 0
      changed_when: "'Installing' in bootstrap_result.stdout"
      when:
        - "'type_lxc' in group_names"

    - name: "Gather Facts now that Python exists"
      ansible.builtin.setup:

  tasks:
    - name: "2.0 Determine whether monitoring is enabled"
      set_fact:
        is_monitored: >-
          {{ lab_state.entornos
             | selectattr('red.ip', 'defined')
             | selectattr('nombre', 'equalto', inventory_hostname)
             | map(attribute='monitor_enabled')
             | first | default(false) }}

    - name: "2.1 Connection Test (No Sudo)"
      ansible.builtin.ping:
      become: no

    # --- MULTI-OS LOGIC ---
    - name: "2.2 Update repositories and system (Debian)"
      ansible.builtin.apt:
        update_cache: yes
        upgrade: dist
      when: ansible_os_family == "Debian"
      register: apt_result
      retries: 3
      delay: 15
      until: apt_result is succeeded

    - name: "2.2 Update repositories and system (Alpine)"
      community.general.apk:
        update_cache: yes
        upgrade: yes
      when: ansible_os_family == "Alpine"
      register: apk_result
      retries: 3
      delay: 15
      until: apk_result is succeeded

    - name: "2.3 Install global dependencies"
      ansible.builtin.package:
        name:
          - curl
          - git
          - vim
          - htop
        state: present

    # --- VM-ONLY ---
    - name: "2.4 Install and enable QEMU Guest Agent (VMs ONLY)"
      block:
        - name: "Install QEMU Agent"
          ansible.builtin.apt:
            name: qemu-guest-agent
            state: present
        - name: "Start QEMU Agent service"
          ansible.builtin.systemd:
            name: qemu-guest-agent
            state: started
            enabled: yes
      when:
        - "'type_vm' in group_names"
        - "ansible_os_family == 'Debian'"

    # --- MONITORING (respects monitor_enabled from lab-state.yaml) ---
    - name: "2.5 Install Node Exporter"
      ansible.builtin.package:
        name: "prometheus-node-exporter"
        state: present
      when: is_monitored | default(false) | bool

    - name: "2.6 Ensure Node Exporter is running"
      ansible.builtin.service:
        # Debian -> prometheus-node-exporter
        # Alpine -> node-exporter
        name: "{{ 'node-exporter' if ansible_os_family == 'Alpine' else 'prometheus-node-exporter' }}"
        state: started
        enabled: yes
      when: is_monitored | default(false) | bool
