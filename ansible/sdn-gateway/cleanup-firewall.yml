---
# ==============================================================================
# PLAY 1: Identify the Gateway from the SSOT
# ==============================================================================
- name: "Phase 1: Identify Gateway for Purge"
  hosts: localhost
  connection: local
  gather_facts: false

  vars:
    path_to_contract: "{{ playbook_dir }}/../../lab-state.yaml"

  tasks:
    - name: "1.1 Read the master contract"
      ansible.builtin.include_vars:
        file: "{{ path_to_contract }}"
        name: contrato

    - name: "1.2 Inject Gateway into in-memory inventory"
      ansible.builtin.add_host:
        name: "{{ item.nombre }}"
        groups: "gateway_nodes"
        ansible_host: "{{ item.red.ip.split('/')[0] }}"
        ansible_user: "doom"
        ansible_ssh_private_key_file: "~/.ssh/id_ed25519_eve"
        ansible_ssh_common_args: "-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null"
      loop: "{{ contrato.entornos }}"
      when:
        - item.estado == "presente"
        - item.tipo == "gateway"

# ==============================================================================
# PLAY 2: Smart Purge of SDN Rules
# ==============================================================================
- name: "Phase 2: Purge SDN Rules (Preserving Physical Nodes)"
  hosts: gateway_nodes
  become: yes

  vars:
    lan_iface: "eth0"
    rasp_lan_ip: "192.168.1.30"
    wg_iface: "wg0"
    zt_iface: "ztktivnucr"
    lan_subnet: "192.168.1.0/24"

  tasks:
    - name: "2.1 Read master contract to filter"
      ansible.builtin.include_vars:
        file: "{{ playbook_dir }}/../../lab-state.yaml"
        name: contrato

    - name: "2.2 Filter only physical nodes (Proxmox)"
      ansible.builtin.set_fact:
        nodos_persistentes: "{{ contrato.entornos | selectattr('tipo', 'defined') | selectattr('tipo', 'equalto', 'fisico') | list }}"

    - name: "2.3 Generate Firewall script (Cleaning VMs)"
      ansible.builtin.template:
        src: templates/eve-firewall.j2
        dest: /usr/local/bin/eve-firewall.sh
        mode: '0755'
      vars:
        # We only pass Makima and Reze to the template, removing the VMs
        entornos_activos: "{{ nodos_persistentes }}"

    - name: "2.4 Apply and Restart Firewall"
      ansible.builtin.systemd:
        name: eve-firewall.service
        state: restarted

