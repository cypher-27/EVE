---
- name: Configurar EVE Gateway SDN Firewall desde SSOT
  hosts: gateway
  become: yes

  vars:
    # Definimos las rutas relativas desde donde se ejecuta el playbook
    path_to_contract: "../../lab-state.yaml"
    wg_iface: "wg0"
    zt_iface: "ztktivnucr"
    lan_iface: "eth0"
    lan_subnet: "192.168.1.0/24"
    rasp_lan_ip: "192.168.1.30"

  tasks:
    - name: 1. Cargar el contrato maestro (lab-state.yaml)
      ansible.builtin.include_vars:
        file: "{{ path_to_contract }}"
        name: contrato

    - name: 2. Generar y aplicar script de Firewall (Jinja2 Dinámico)
      ansible.builtin.template:
        src: templates/eve-firewall.j2
        dest: /usr/local/bin/eve-firewall.sh
        owner: root
        group: root
        mode: '0755'
      # Pasamos el objeto 'contrato' directamente a la plantilla
      vars:
        entornos_activos: "{{ contrato.entornos }}"

    - name: 3. Reiniciar el servicio del Firewall
      ansible.builtin.systemd:
        name: eve-firewall.service
        state: restarted

