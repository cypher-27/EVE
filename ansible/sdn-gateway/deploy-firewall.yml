}---
# ==============================================================================
# PLAY 1: Identificar al Gateway desde el SSOT
# ==============================================================================
- name: "Fase 1: Identificar Gateway desde SSOT"
  hosts: localhost
  connection: local
  gather_facts: false

  vars:
    path_to_contract: "{{ playbook_dir }}/../../lab-state.yaml"

  tasks:
    - name: "1.1 Leer el contrato maestro"
      ansible.builtin.include_vars:
        file: "{{ path_to_contract }}"
        name: contrato

    - name: "1.2 Inyectar Gateway al inventario en memoria"
      ansible.builtin.add_host:
        name: "{{ item.nombre }}"
        groups: "gateway_nodes"
        ansible_host: "{{ item.red.ip.split('/')[0] }}"
        ansible_user: "doom" # O el usuario correspondiente
        # Aplicamos el bypass de SSH Fingerprint aquí también
        ansible_ssh_extra_args: "-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null"
      loop: "{{ contrato.entornos }}"
      when: 
        - item.estado == "presente"
        - item.tipo == "gateway"

# ==============================================================================
# PLAY 2: Configurar el Firewall (Ejecución Real)
# ==============================================================================
- name: "Fase 2: Aplicar Reglas de Firewall SDN"
  hosts: gateway_nodes
  become: yes

  vars:
    # Estas variables son propias de la lógica de red de la Pi
    wg_iface: "wg0"
    zt_iface: "ztktivnucr"
    lan_subnet: "192.168.1.0/24"

  tasks:
    - name: "2.1 Re-cargar contrato para usarlo en el template"
      ansible.builtin.include_vars:
        file: "{{ playbook_dir }}/../../lab-state.yaml"
        name: contrato

    - name: "2.2 Generar script de Firewall (Jinja2)"
      ansible.builtin.template:
        src: templates/eve-firewall.j2
        dest: /usr/local/bin/eve-firewall.sh
        mode: '0755'
      vars:
        entornos_activos: "{{ contrato.entornos }}"

    - name: "2.3 Aplicar y Reiniciar Firewall"
      ansible.builtin.systemd:
        name: eve-firewall.service
        state: restarted

