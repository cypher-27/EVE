name: EVE - Sanity Check

on:
  push:
    branches: [ main ]
  workflow_dispatch:

env:
  SOPS_AGE_KEY_FILE: /home/runner/.config/sops/age/keys.txt

jobs:
  sanity-check:
    name: Validate Environment & Contract
    runs-on: eve

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Load secrets
        run: |
          sops -d secrets.enc.yaml | python3 -c "
          import sys, yaml
          for k, v in yaml.safe_load(sys.stdin).items():
              print(f'{k.upper()}={v}')" >> $GITHUB_ENV

      - name: Verify toolchain
        run: |
          echo "[+] Host: $(hostname) | User: $(whoami)"
          terraform version        || exit 1
          ansible --version        || exit 1
          ansible-playbook --version || exit 1
          sops --version           || exit 1
          python3 --version        || exit 1

      - name: Run validator unit tests (pytest)
        run: |
          pip install --break-system-packages --quiet pytest
          python -m pytest tests/ -v

      - name: Verify Age identity
        run: |
          if [ ! -f "$SOPS_AGE_KEY_FILE" ]; then
            echo "❌ Age key not found at $SOPS_AGE_KEY_FILE"
            exit 1
          fi
          head -n 1 "$SOPS_AGE_KEY_FILE" > /dev/null
          echo "✅ Age key present"

      - name: Verify ZeroTier connectivity
        run: |
          ZT_IFACES=$(ip -br addr show | awk '{print $1}' | grep '^zt' || true)
          if [ -z "$ZT_IFACES" ]; then
            echo "⚠ WARNING: No active ZeroTier interface detected — cluster may be unreachable"
            echo "ZT_ONLINE=false" >> $GITHUB_ENV
          else
            echo "✅ ZeroTier interfaces: $ZT_IFACES"
            echo "ZT_ONLINE=true" >> $GITHUB_ENV
          fi

      - name: Verify cluster reachability
        run: |
          if [[ "$ZT_ONLINE" == "false" ]]; then
            echo "⚠ Skipping cluster ping — ZeroTier is down"
            exit 0
          fi
          if ! ping -c 2 -W 3 10.1.1.1 &>/dev/null; then
            echo "❌ Cannot reach doom over ZeroTier — check tunnel"
            exit 1
          fi
          echo "✅ doom reachable"

      - name: Validate lab-state contract
        run: |
          chmod +x orchestrator.sh
          ./orchestrator.sh --stage-validate
        env:
          TF_VAR_eve_env: "main"

      - name: Notify failure
        if: failure()
        run: |
          MSG=$(printf '❌ *SANITY CHECK FAILED*\n📌 Branch: %s\n👤 Pushed by: %s\n🔗 %s' \
            "${{ github.ref_name }}" \
            "${{ github.actor }}" \
            "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}")
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d chat_id="${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=${MSG}" \
            -d parse_mode="Markdown" > /dev/null

