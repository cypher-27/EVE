kkname: EVE - Sanity Check

on:
  push:
    branches: [ main ]
  workflow_dispatch:

env:
  SOPS_AGE_KEY_FILE: /home/runner/.config/sops/age/keys.txt

jobs:
  sanity-check:
    name: Validate Environment & Contract
    runs-on: eve

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify toolchain
        run: |
          echo "[+] Host: $(hostname) | User: $(whoami)"
          terraform version   || exit 1
          ansible --version   || exit 1
          ansible-playbook --version || exit 1
          sops --version      || exit 1
          python3 --version   || exit 1

      - name: Verify Age identity
        run: |
          if [ ! -f "$SOPS_AGE_KEY_FILE" ]; then
            echo "❌ Age key not found at $SOPS_AGE_KEY_FILE"
            exit 1
          fi
          head -n 1 "$SOPS_AGE_KEY_FILE" > /dev/null
          echo "✅ Age key present"

      - name: Verify ZeroTier connectivity
        run: |
          ZT_IFACES=$(ip -br addr show | awk '{print $1}' | grep '^zt' || true)
          if [ -z "$ZT_IFACES" ]; then
            echo "⚠ Warning: No active ZeroTier interface detected"
          else
            echo "✅ ZeroTier interfaces: $ZT_IFACES"
          fi

      - name: Validate lab-state contract
        run: |
          chmod +x orchestrator.sh
          ./orchestrator.sh --stage-validate
        env:
          TF_VAR_eve_env: dev

