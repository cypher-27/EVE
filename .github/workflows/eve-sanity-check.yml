name: EVE - Sanity Check

on:
  push:
    branches: [ main, dev ]
  workflow_dispatch:

# Definimos variables globales para que SOPS funcione
env:
  SOPS_AGE_KEY_FILE: /home/runner/.config/sops/age/keys.txt

jobs:
  validate-environment:
    runs-on: eve
    
    steps:
      - name: 📂 Clonando repositorio
        uses: actions/checkout@v4

      - name: 🛠 Verificando herramientas de EVE
        run: |
          echo "[+] Hostname: $(hostname)"
          echo "[+] Usuario: $(whoami)"
          terraform version || exit 1
          ansible --version || exit 1
          sops --version || exit 1

      - name: 🔑 Verificando Identidad (Age)
        run: |
          if [ -f "$SOPS_AGE_KEY_FILE" ]; then
            echo "✅ Llave de Age detectada en: $SOPS_AGE_KEY_FILE"
            # Intento de lectura (sin mostrar contenido) para validar permisos
            head -n 1 "$SOPS_AGE_KEY_FILE" > /dev/null
          else
            echo "❌ ERROR: No se encuentra la llave en $SOPS_AGE_KEY_FILE"
            exit 1
          fi

      - name: 🌐 Verificando Conectividad ZeroTier
        run: |
          # Buscamos todas las interfaces que empiecen por 'zt'
          ZT_IFACES=$(ip -br addr show | awk '{print $1}' | grep '^zt')
          if [ -z "$ZT_IFACES" ]; then
            echo "⚠ Warning: No se detectó ninguna interfaz de ZeroTier activa."
          else
            echo "✅ Interfaces ZeroTier detectadas:"
            echo "$ZT_IFACES" | while read -r iface; do
              echo ""
              echo "  🔹 Interfaz: $iface"
              ip addr show "$iface" | grep "inet " | sed 's/^/    /'
            done
          fi

