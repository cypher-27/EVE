name: EVE - Janitor

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:
    inputs:
      confirmacion:
        description: 'Type "DESTROY" to confirm ephemeral cleanup'
        required: true
        default: ''

jobs:
  cleanup:
    name: Ephemeral Cleanup
    runs-on: eve

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate confirmation (manual only)
        if: github.event_name == 'workflow_dispatch'
        run: |
          if [[ "${{ github.event.inputs.confirmacion }}" != "DESTROY" ]]; then
            echo "❌ Invalid confirmation. Type 'DESTROY' to proceed."
            exit 1
          fi

      - name: Mark ephemeral resources as absent
        run: |
          python3 - <<'EOF'
          import yaml

          with open('lab-state.yaml', 'r') as f:
              data = yaml.safe_load(f)

          changed = []
          for env in data.get('entornos', []):
              if env.get('efimero', False) and env.get('estado') == 'presente':
                  env['estado'] = 'ausente'
                  changed.append(env['nombre'])

          if not changed:
              print("No ephemeral resources to clean up.")
              exit(0)

          with open('lab-state.yaml', 'w') as f:
              yaml.dump(data, f, allow_unicode=True, default_flow_style=False)

          print(f"Marked as absent: {', '.join(changed)}")
          EOF

      - name: Notify start
        run: |
          source <(sops -d secrets.enc.yaml | python3 -c "
          import sys, yaml
          for k, v in yaml.safe_load(sys.stdin).items():
              print(f\"export {k.upper()}='{v}'\")")
          MSG=$(printf '🧹 *JANITOR*: Starting ephemeral cleanup\n👤 *Triggered by:* %s' \
            "${{ github.actor }}")
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d chat_id="${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=${MSG}" \
            -d parse_mode="Markdown" > /dev/null

      - name: Run deploy to apply absent state
        run: |
          chmod +x orchestrator.sh
          ./orchestrator.sh --stage-infra
        env:
          TF_VAR_eve_env: "main"

      - name: Notify result
        if: always()
        run: |
          source <(sops -d secrets.enc.yaml | python3 -c "
          import sys, yaml
          for k, v in yaml.safe_load(sys.stdin).items():
              print(f\"export {k.upper()}='{v}'\")")
          if [[ "${{ job.status }}" == "success" ]]; then
            MSG="✅ *JANITOR*: Ephemeral cleanup complete"
          else
            MSG="❌ *JANITOR*: Ephemeral cleanup failed"
          fi
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d chat_id="${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=${MSG}" \
            -d parse_mode="Markdown" > /dev/null

