name: EVE - Janitor (Limpieza y Mantenimiento)

on:
  schedule:
    - cron: '0 0 * * *'  # Limpieza automática diaria (solo afecta dev)
  workflow_dispatch:
    inputs:
      confirmacion:
        description: 'Escribe "DESTROY" para confirmar la limpieza'
        required: true
        default: 'NO'

env:
  TF_VAR_eve_env: dev  # Por defecto dev, se sobrescribe según rama

jobs:
  cleanup:
    name: Limpieza de Infraestructura
    runs-on: eve

    steps:
      - name: Detectar entorno
        id: entorno
        run: |
          if [[ "${{ github.ref }}" == *"main"* ]]; then
            echo "env=main" >> $GITHUB_OUTPUT
            echo "⚠️ MODO: MAIN (Producción - SSD ZFS)"
          else
            echo "env=dev" >> $GITHUB_OUTPUT
            echo "🔧 MODO: DEV (Efímero - HDD)"
          fi

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Verificación de Seguridad
        run: |
          # Para scheduled runs: SOLO permitido en dev
          if [[ "${{ github.event_name }}" == "schedule" ]]; then
            if [[ "${{ github.ref }}" == *"main"* ]]; then
              echo "❌ ERROR: Cron no permitido en main. El Janitor automático solo opera en dev."
              exit 1
            fi
            echo "✅ Cron autorizado para dev"
          fi

          # Para workflow_dispatch: requiere confirmación escrita
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            if [[ "${{ github.event.inputs.confirmacion }}" != "DESTROY" ]]; then
              echo "❌ ERROR: Palabra de seguridad incorrecta."
              echo "💡 Debes escribir 'DESTROY' (sin comillas) para confirmar."
              exit 1
            fi
            echo "✅ Confirmación recibida: DESTROY"
          fi

      - name: Notificar inicio de limpieza
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          ENTORNO="${{ steps.entorno.outputs.env }}"
          MODO="${{ github.event_name }}"
          if [ "$MODO" == "schedule" ]; then
            MODO_TEXTO="Automático (Cron)"
          else
            MODO_TEXTO="Manual"
          fi
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d chat_id="${TELEGRAM_CHAT_ID}" \
            -d text="🧹 *JANITOR*: Iniciando limpieza de *${ENTORNO}*
        📋 *Modo:* ${MODO_TEXTO}" \
            -d parse_mode="Markdown" > /dev/null

      - name: Ejecutar Terraform Destroy
        run: |
          chmod +x orchestrator.sh
          ./orchestrator.sh --destroy --force
        env:
          TF_VAR_eve_env: ${{ steps.entorno.outputs.env }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

      - name: Notificar limpieza completada
        if: always()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          ENTORNO="${{ steps.entorno.outputs.env }}"
          if [ "${{ job.status }}" == "success" ]; then
            EMOJI="✅"
            ESTADO="Completada"
          else
            EMOJI="❌"
            ESTADO="Fallida"
          fi
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d chat_id="${TELEGRAM_CHAT_ID}" \
            -d text="${EMOJI} *JANITOR*: Limpieza de *${ENTORNO}* ${ESTADO}" \
            -d parse_mode="Markdown" > /dev/null
