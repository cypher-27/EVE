name: EVE - Janitor

on:
  schedule:
    - cron: '0 0 * * *'   # Daily — ephemeral only
  workflow_dispatch:
    inputs:
      mode:
        description: 'Cleanup scope'
        required: true
        default: 'ephemeral'
        type: choice
        options:
          - ephemeral       # Only efimero: true resources
          - full-lab        # All non-core resources
      confirmacion:
        description: 'Type "DESTROY" to confirm'
        required: true
        default: ''

jobs:
  cleanup:
    name: Infrastructure Cleanup
    runs-on: eve

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate confirmation
        if: github.event_name == 'workflow_dispatch'
        run: |
          if [[ "${{ github.event.inputs.confirmacion }}" != "DESTROY" ]]; then
            echo "❌ Invalid confirmation. Type 'DESTROY' to proceed."
            exit 1
          fi

      - name: Mark resources as absent
        run: |
          MODE="${{ github.event_name == 'schedule' && 'ephemeral' || github.event.inputs.mode }}"
          python3 - <<EOF
          import yaml, os

          mode = os.environ.get('JANITOR_MODE', 'ephemeral')

          with open('lab-state.yaml', 'r') as f:
              data = yaml.safe_load(f)

          changed = []
          for env in data.get('entornos', []):
              if env.get('core', False):
                  continue                          # Never touch core
              if env.get('estado') != 'presente':
                  continue                          # Already absent

              if mode == 'ephemeral' and env.get('efimero', False):
                  env['estado'] = 'ausente'
                  changed.append(env['nombre'])
              elif mode == 'full-lab':              # All non-core, regardless of efimero
                  env['estado'] = 'ausente'
                  changed.append(env['nombre'])

          if not changed:
              print("Nothing to clean up.")
              exit(0)

          with open('lab-state.yaml', 'w') as f:
              yaml.dump(data, f, allow_unicode=True, default_flow_style=False)

          print(f"Marked as absent: {', '.join(changed)}")
          EOF
        env:
          JANITOR_MODE: ${{ github.event_name == 'schedule' && 'ephemeral' || github.event.inputs.mode }}

      - name: Notify start
        run: |
          source <(sops -d secrets.enc.yaml | python3 -c "
          import sys, yaml
          for k, v in yaml.safe_load(sys.stdin).items():
              print(f\"export {k.upper()}='{v}'\")")
          MODE="${{ github.event_name == 'schedule' && 'ephemeral' || github.event.inputs.mode }}"
          MSG=$(printf '🧹 *JANITOR* [%s]\nScope: *%s*\n👤 Triggered by: %s' \
            "${{ github.event_name }}" "$MODE" "${{ github.actor }}")
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d chat_id="${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=${MSG}" \
            -d parse_mode="Markdown" > /dev/null

      - name: Apply absent state
        run: |
          chmod +x orchestrator.sh
          ./orchestrator.sh --stage-infra
        env:
          TF_VAR_eve_env: "main"

      - name: Notify result
        if: always()
        run: |
          source <(sops -d secrets.enc.yaml | python3 -c "
          import sys, yaml
          for k, v in yaml.safe_load(sys.stdin).items():
              print(f\"export {k.upper()}='{v}'\")")
          if [[ "${{ job.status }}" == "success" ]]; then
            MSG="✅ *JANITOR*: Cleanup complete"
          else
            MSG="❌ *JANITOR*: Cleanup failed"
          fi
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d chat_id="${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=${MSG}" \
            -d parse_mode="Markdown" > /dev/null

