name: EVE - Janitor

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:
    inputs:
      entorno:
        description: 'Environment to destroy'
        required: true
        default: 'dev'
        type: choice
        options:
          - dev
          - main
      confirmacion:
        description: 'Type "DESTROY" to confirm'
        required: true
        default: ''

jobs:
  cleanup:
    name: Infrastructure Cleanup
    runs-on: eve

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Determine target environment
        id: target
        run: |
          if [[ "${{ github.event_name }}" == "schedule" ]]; then
            echo "target_env=dev" >> $GITHUB_OUTPUT
            echo "🔧 Mode: SCHEDULED → Environment: DEV"
          elif [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            if [[ "${{ github.event.inputs.confirmacion }}" != "DESTROY" ]]; then
              echo "❌ Invalid confirmation. You must type 'DESTROY'."
              exit 1
            fi
            echo "target_env=${{ github.event.inputs.entorno }}" >> $GITHUB_OUTPUT
            echo "🎛️ Mode: MANUAL → Environment: ${{ github.event.inputs.entorno }}"
          fi

      - name: Notify start
        run: |
          source <(sops -d secrets.enc.yaml | python3 -c "
          import sys, yaml
          for k, v in yaml.safe_load(sys.stdin).items():
              print(f\"export {k.upper()}='{v}'\")
          ")
          MSG=$(printf '🧹 *JANITOR*: Starting cleanup of *%s*\n👤 *Triggered by:* %s' \
            "${{ steps.target.outputs.target_env }}" \
            "${{ github.actor }}")
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d chat_id="${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=${MSG}" \
            -d parse_mode="Markdown" > /dev/null

      - name: Run Terraform Destroy
        run: |
          chmod +x orchestrator.sh
          ./orchestrator.sh --destroy --force
        env:
          TF_VAR_eve_env: ${{ steps.target.outputs.target_env }}

      - name: Notify result
        if: always()
        run: |
          source <(sops -d secrets.enc.yaml | python3 -c "
          import sys, yaml
          for k, v in yaml.safe_load(sys.stdin).items():
              print(f\"export {k.upper()}='{v}'\")
          ")
          if [[ "${{ job.status }}" == "success" ]]; then
            MSG=$(printf '✅ *JANITOR*: Cleanup of *%s* completed' "${{ steps.target.outputs.target_env }}")
          else
            MSG=$(printf '❌ *JANITOR*: Cleanup of *%s* failed' "${{ steps.target.outputs.target_env }}")
          fi
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d chat_id="${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=${MSG}" \
            -d parse_mode="Markdown" > /dev/null

