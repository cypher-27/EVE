name: EVE - Automated Deployment

on:
  push:
    branches: [ dev, main ]
  workflow_dispatch:
    inputs:
      entorno:
        description: 'Entorno a desplegar'
        required: true
        default: 'dev'
        type: choice
        options:
          - dev
          - main

jobs:
  deploy:
    name: Infrastructure Deployment
    runs-on: eve

    steps:
      - name: Detectar entorno
        id: entorno
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "env=${{ github.event.inputs.entorno }}" >> $GITHUB_OUTPUT
            echo "🎛️ Modo MANUAL → Entorno: ${{ github.event.inputs.entorno }}"
          else
            if [[ "${{ github.ref }}" == *"main"* ]]; then
              echo "env=main" >> $GITHUB_OUTPUT
              echo "🚀 Modo PUSH → Entorno: MAIN (Producción)"
            else
              echo "env=dev" >> $GITHUB_OUTPUT
              echo "🚀 Modo PUSH → Entorno: DEV (Efímero)"
            fi
          fi

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Stage 1 - Validate
        run: |
          chmod +x orchestrator.sh
          ./orchestrator.sh --stage-validate
        env:
          TF_VAR_eve_env: ${{ steps.entorno.outputs.env }}

      - name: Stage 2 - Firewall SDN
        run: ./orchestrator.sh --stage-firewall
        env:
          TF_VAR_eve_env: ${{ steps.entorno.outputs.env }}

      - name: Stage 3 - Infrastructure
        run: ./orchestrator.sh --stage-infra
        env:
          TF_VAR_eve_env: ${{ steps.entorno.outputs.env }}

      - name: Stage 4 - Configuration
        run: ./orchestrator.sh --stage-config
        env:
          TF_VAR_eve_env: ${{ steps.entorno.outputs.env }}

      - name: Notificar despliegue exitoso
        if: success()
        run: |
          source <(sops -d secrets.enc.env) || { echo "Error cargando secretos"; exit 0; }
          ENTORNO="${{ steps.entorno.outputs.env }}"
          MSG="✅ *DESPLIEGUE COMPLETO*\n🎯 *Entorno:* ${ENTORNO}\n📋 *Rama:* \`${{ github.ref_name }}\`"
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d chat_id="${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=${MSG}" \
            -d parse_mode="Markdown" > /dev/null
