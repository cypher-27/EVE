kname: EVE - Deploy

on:
  workflow_dispatch:
    inputs:
      entorno:
        description: 'Entorno a desplegar'
        required: true
        default: 'dev'
        type: choice
        options:
          - dev
          - main

jobs:
  deploy:
    name: Infrastructure Deployment
    runs-on: eve

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Stage 1 - Validate
        run: |
          chmod +x orchestrator.sh
          ./orchestrator.sh --stage-validate
        env:
          TF_VAR_eve_env: ${{ github.event.inputs.entorno }}

      - name: Stage 2 - Firewall SDN
        run: ./orchestrator.sh --stage-firewall
        env:
          TF_VAR_eve_env: ${{ github.event.inputs.entorno }}

      - name: Stage 3 - Infrastructure
        run: ./orchestrator.sh --stage-infra
        env:
          TF_VAR_eve_env: ${{ github.event.inputs.entorno }}

      - name: Stage 4 - Configuration
        run: ./orchestrator.sh --stage-config
        env:
          TF_VAR_eve_env: ${{ github.event.inputs.entorno }}

      - name: Notify success
        if: success()
        run: |
          source <(sops -d secrets.enc.yaml | python3 -c "
          import sys, yaml
          for k, v in yaml.safe_load(sys.stdin).items():
              print(f\"export {k.upper()}='{v}'\")
          ")
          MSG=$(printf '✅ *DEPLOY COMPLETE*\n🎯 *Environment:* %s\n👤 *Triggered by:* %s' \
            "${{ github.event.inputs.entorno }}" \
            "${{ github.actor }}")
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d chat_id="${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=${MSG}" \
            -d parse_mode="Markdown" > /dev/null

