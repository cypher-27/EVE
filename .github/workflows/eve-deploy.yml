name: EVE - Deploy

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'Deployment mode'
        required: true
        default: 'plan'
        type: choice
        options:
          - plan
          - apply

jobs:
  deploy:
    name: Infrastructure Deployment
    runs-on: eve

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Load secrets
        run: |
          sops -d secrets.enc.yaml | python3 -c "
          import sys, yaml
          data = yaml.safe_load(sys.stdin)
          with open('$GITHUB_ENV', 'a') as env_file:
              for k, v in data.items():
                  print(f'::add-mask::{v}')
                  env_file.write(f'{k.upper()}={v}\n')
          "

      - name: Stage 1 - Validate
        run: |
          chmod +x orchestrator.sh
          ./orchestrator.sh --stage-validate
        env:
          TF_VAR_eve_env: "main"

      - name: Stage 2 - Firewall SDN
        if: ${{ github.event.inputs.mode == 'apply' }}
        run: ./orchestrator.sh --stage-firewall
        env:
          TF_VAR_eve_env: "main"

      - name: Stage 3 - Infrastructure
        run: ./orchestrator.sh ${{ github.event.inputs.mode == 'plan' && '--plan' || '--stage-infra' }}
        env:
          TF_VAR_eve_env: "main"

      - name: Stage 4 - Configuration
        if: ${{ github.event.inputs.mode == 'apply' }}
        run: ./orchestrator.sh --stage-config
        env:
          TF_VAR_eve_env: "main"

      - name: Notify success
        if: success()
        run: |
          MSG=$(printf '✅ *DEPLOY COMPLETE*\n🎯 *Mode:* %s\n👤 *Triggered by:* %s' \
            "${{ github.event.inputs.mode }}" \
            "${{ github.actor }}")
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d chat_id="${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=${MSG}" \
            -d parse_mode="Markdown" > /dev/null

      - name: Notify failure
        if: failure()
        run: |
          MSG=$(printf '❌ *DEPLOY FAILED*\n🎯 *Mode:* %s\n👤 *Triggered by:* %s\n🔗 %s' \
            "${{ github.event.inputs.mode }}" \
            "${{ github.actor }}" \
            "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}")
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d chat_id="${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=${MSG}" \
            -d parse_mode="Markdown" > /dev/null

