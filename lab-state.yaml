# ==========================================
# EVE - SINGLE SOURCE OF TRUTH (v2.0)
# ==========================================

entornos:
  # === INFRAESTRUCTURA CORE (Intocables) ===
  # El orquestador NUNCA debe intentar destruirlos.
  - nombre: "doom-gateway"
    estado: "presente"
    tipo: "gateway"
    core: true
    red:
      ip: "192.168.1.30/24"

  - nombre: "makima-core"
    estado: "presente"
    tipo: "fisico"
    core: true
    red:
      ip: "192.168.1.20/24"
    firewall_externo:
      - puerto: 8006
        protocolo: "tcp"
        descripcion: "GUI Makima"

  - nombre: "reze-core"
    estado: "presente"
    tipo: "fisico"
    core: true
    red:
      ip: "192.168.1.10/24"
    firewall_externo:
      - puerto: 8006
        protocolo: "tcp"
        descripcion: "GUI Reze"

  # === SERVICIOS BASE (Opcionales pero Permanentes) ===
  # Si no quieres Grafana, solo cambia 'estado' a 'ausente'.
  - nombre: "eve-monitor"
    estado: "presente"
    tipo: "lxc"
    core: true
    os: "alpine"
    nodo_proxmox: "makima"
    vmid: 300
    red:
      ip: "192.168.1.40/24"
      gateway: "192.168.1.30"
    recursos:
      cores: 1
      memoria: 512
      disco: 8
      disco_datos:
        storage: "hdd_data"
        size: "50G"
    firewall_externo:
      - puerto: 22
        protocolo: "tcp"
        descripcion: "SSH Admin"
      - puerto: 3000
        protocolo: "tcp"
        descripcion: "Grafana Web"
      - puerto: 8428
        protocolo: "tcp"
        descripcion: "VictoriaMetrics Ingest"

# === LABORATORIOS DINÁMICOS (Lo que tú o la IA crean) ===
  - nombre: "eve-test-01"
    estado: "ausente"
    tipo: "vm"
    core: false
    efimero: true
    monitor_enabled: true
    nodo_proxmox: "makima"
    vmid: 100
    plantilla: "debian13-template"
    red:
      ip: "192.168.1.41/24"
      gateway: "192.168.1.30"
    recursos:
      cores: 2
      memoria: 2048
      disco: 20
    firewall_externo:
      - puerto: 22
        protocolo: "tcp"
        descripcion: "SSH Admin"

  - nombre: "eve-lxc-01"
    estado: "ausente"
    tipo: "lxc"
    core: false
    efimero: false
    monitor_enabled: false
    os: "alpine"
    nodo_proxmox: "reze"
    vmid: 200
    red:
      ip: "192.168.1.42/24"
      gateway: "192.168.1.30"
    recursos:
      cores: 1
      memoria: 512
      disco: 8
    firewall_externo:
      - puerto: 22
        protocolo: "tcp"
        descripcion: "SSH LXC"

# === LABORATORIO DE FORENSE (Viper Nest) ===
  - nombre: "eve-viper"
    estado: "ausente"
    tipo: "vm"
    core: false
    efimero: true        # Directo al HDD para que el Janitor lo limpie
    monitor_enabled: true
    nodo_proxmox: "reze" # Usamos Reze para dejar libre el SSD de Makima
    vmid: 500
    plantilla: "debian13-template"
    red:
      ip: "192.168.1.43/24"
      gateway: "192.168.1.30"
    recursos:
      cores: 2           # Falco y Docker necesitan al menos 2
      memoria: 2048      # 2GB es el "sweet spot" para no sufrir
      disco: 30          # 30GB en el HDD de Reze es nada
    firewall_externo:
      - puerto: 22
        protocolo: "tcp"
        descripcion: "SSH Admin"

# === TEST RESOURCES (Temporary) ===
  - nombre: "eve-test-lxc"
    estado: "presente"
    tipo: "lxc"
    os: "alpine"
    efimero: true
    monitor_enabled: false
    nodo_proxmox: "makima"
    vmid: 101
    recursos:
      cores: 1
      memoria: 256
      disco: 4
    red:
      ip: "192.168.1.44/24"
      gateway: "192.168.1.30"

  - nombre: "eve-test-vm"
    estado: "presente"
    tipo: "vm"
    plantilla: "debian13-template"
    efimero: false
    monitor_enabled: true
    nodo_proxmox: "reze"
    vmid: 102
    recursos:
      cores: 1
      memoria: 512
      disco: 8
    red:
      ip: "192.168.1.45/24"
      gateway: "192.168.1.30"

