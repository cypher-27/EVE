entornos:
  # === INFRAESTRUCTURA CORE (Físicos) ===
  - nombre: "doom-gateway"
    estado: "presente"
    tipo: "gateway"
    red:
      ip: "192.168.1.30/24"

  - nombre: "makima-core"
    estado: "presente"
    tipo: "fisico"
    red:
      ip: "192.168.1.20/24"
    firewall_externo:
      - puerto: 8006
        protocolo: "tcp"
        descripcion: "GUI Makima"

  - nombre: "reze-core"
    estado: "presente"
    tipo: "fisico"
    red:
      ip: "192.168.1.10/24"
    firewall_externo:
      - puerto: 8006
        protocolo: "tcp"
        descripcion: "GUI Reze"

  # === VMs y LXCs ===
  - nombre: "eve-test-01"
    estado: "presente"
    tipo: "vm"
    nodo_proxmox: "makima"
    vmid: 100
    plantilla: "debian13-template"
    red:
      ip: "192.168.1.50/24"
      gateway: "192.168.1.30"
    recursos:
      cores: 2
      memoria: 2048
      disco: 20
    firewall_externo:
      - puerto: 22
        protocolo: "tcp"
        descripcion: "SSH Admin"

  - nombre: "lxc-ligero-01"
    estado: "presente"
    tipo: "lxc"
    os: "alpine"
    nodo_proxmox: "reze"
    vmid: 200
    red:
      ip: "192.168.1.51/24"
      gateway: "192.168.1.30"
    recursos:
      cores: 1
      memoria: 512
      disco: 8
    firewall_externo:
      - puerto: 22
        protocolo: "tcp"
        descripcion: "SSH LXC"
