# ==========================================
# EVE - SINGLE SOURCE OF TRUTH (v2.0)
# STRESS TEST BUILD v2.2 - LIGERO, PARA APPLY REAL
# Objetivo: confirmar si firewall_externo se aplica en algun punto del
# pipeline (sospecha: se aplica via Ansible post-provision, no via
# Terraform/Proxmox nativo, ya que el plan de v2.1 no mostro ningun
# recurso de firewall pese a que eve-lab-vm SI declaraba SSH 22).
#
# Se recorta todo lo no esencial para minimizar el blast radius de un
# apply real. Los catches ya confirmados (IP, VMID, storage, tamano,
# campos requeridos, RAM/CPU) NO se repiten aqui.
#
# Metodo de prueba:
#   1. terraform apply de este archivo (2 LXC nuevos, minimos)
#   2. Verificar en cada uno, por SSH o consola Proxmox:
#      - stress-fw-empty: sin firewall_externo declarado
#      - stress-fw-full : firewall_externo con SSH 22 declarado
#   3. Comparar: iptables -L / ufw status / reglas de firewall en
#      Proxmox GUI (Datacenter > firewall, y a nivel del contenedor)
#      entre ambos. Si son identicos -> firewall_externo no hace nada
#      en ningun punto del pipeline (confirma el hallazgo de v2.1).
#      Si stress-fw-full tiene reglas y stress-fw-empty no -> el
#      enforcement ocurre en Ansible, fuera de la vista de `terraform plan`.
# ==========================================

entornos:

  # === INFRAESTRUCTURA CORE (sin cambios, nunca deben tocarse) ===

  - nombre: "doom-gateway"
    estado: "presente"
    tipo: "gateway"
    core: true
    red:
      ip: "192.168.1.30/24"

  - nombre: "makima-core"
    estado: "presente"
    tipo: "fisico"
    core: true
    red:
      ip: "192.168.1.20/24"
    firewall_externo:
      - puerto: 8006
        protocolo: "tcp"
        descripcion: "Proxmox GUI"

  - nombre: "reze-core"
    estado: "presente"
    tipo: "fisico"
    core: true
    red:
      ip: "192.168.1.10/24"
    firewall_externo:
      - puerto: 8006
        protocolo: "tcp"
        descripcion: "Proxmox GUI"

  # === MONITOREO (ya desplegado, sin cambios) ===

  - nombre: "eve-monitor"
    estado: "presente"
    tipo: "lxc"
    core: false
    os: "alpine"
    nodo_proxmox: "makima"
    vmid: 300
    monitor_enabled: true
    red:
      ip: "192.168.1.40/24"
      gateway: "192.168.1.30"
    recursos:
      cores: 1
      memoria: 512
      disco: 8
      disco_datos:
        storage: "hdd_data"
        size: "50G"
        mp: "/var/lib/victoria-metrics"
    firewall_externo:
      - puerto: 22
        protocolo: "tcp"
        descripcion: "SSH Admin"
      - puerto: 3000
        protocolo: "tcp"
        descripcion: "Grafana"
      - puerto: 8428
        protocolo: "tcp"
        descripcion: "VictoriaMetrics"

  # === TEST GEMELO A: SIN firewall_externo (control) ===

  - nombre: "stress-fw-empty"
    estado: "presente"
    tipo: "lxc"
    core: false
    efimero: true
    monitor_enabled: false
    os: "alpine"
    nodo_proxmox: "reze"
    vmid: 206
    red:
      ip: "192.168.1.60/24"
      gateway: "192.168.1.30"
    recursos:
      cores: 1
      memoria: 256
      disco: 4
    # sin firewall_externo -> caso de control

  # === TEST GEMELO B: CON firewall_externo bien declarado ===

  - nombre: "stress-fw-full"
    estado: "presente"
    tipo: "lxc"
    core: false
    efimero: true
    monitor_enabled: false
    os: "alpine"
    nodo_proxmox: "reze"
    vmid: 207
    red:
      ip: "192.168.1.61/24"
      gateway: "192.168.1.30"
    recursos:
      cores: 1
      memoria: 256
      disco: 4
    firewall_externo:
      - puerto: 22
        protocolo: "tcp"
        descripcion: "SSH Admin"
