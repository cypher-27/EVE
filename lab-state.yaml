# ==========================================
# EVE - SINGLE SOURCE OF TRUTH (v2.0)
# STRESS TEST BUILD v2.3 - AISLAR CAUSA DEL FALLO EN STAGE: FIREWALL
#
# Contexto: v2.2 fallo en [STAGE: FIREWALL] con "Failed at: Ansible SDN"
# al intentar aplicar reglas en doom-gateway. Hipotesis principal:
# 'stress-fw-empty' NO declara la clave firewall_externo (esta ausente,
# no es una lista vacia []), y el rol de Ansible SDN probablemente hace
# un `for rule in host.firewall_externo` en Jinja2 que revienta con
# AnsibleUndefinedVariable si la clave no existe.
#
# Este build quita 'stress-fw-empty' por completo y deja solo
# 'stress-fw-full' (que si declara la clave con una regla real).
# Si el stage de firewall PASA con este build:
#   -> confirma que el crash es por la clave ausente, no por doom-gateway
#      en si (conectividad, credenciales, API de Proxmox, etc.)
#   -> siguiente paso: volver a meter un recurso de control con
#      firewall_externo: [] (lista vacia explicita) para verificar si
#      ESE caso si pasa, aislando aun mas: "clave ausente" vs "lista vacia"
# Si el stage de firewall SIGUE fallando con este build:
#   -> el problema no es la clave ausente, hay que revisar conectividad/
#      permisos de Ansible hacia doom-gateway o el modulo SDN en si
# ==========================================

entornos:

  # === INFRAESTRUCTURA CORE (sin cambios, nunca deben tocarse) ===

  - nombre: "doom-gateway"
    estado: "presente"
    tipo: "gateway"
    core: true
    red:
      ip: "192.168.1.30/24"

  - nombre: "makima-core"
    estado: "presente"
    tipo: "fisico"
    core: true
    red:
      ip: "192.168.1.20/24"
    firewall_externo:
      - puerto: 8006
        protocolo: "tcp"
        descripcion: "Proxmox GUI"

  - nombre: "reze-core"
    estado: "presente"
    tipo: "fisico"
    core: true
    red:
      ip: "192.168.1.10/24"
    firewall_externo:
      - puerto: 8006
        protocolo: "tcp"
        descripcion: "Proxmox GUI"

  # === MONITOREO (ya desplegado, sin cambios) ===

  - nombre: "eve-monitor"
    estado: "presente"
    tipo: "lxc"
    core: false
    os: "alpine"
    nodo_proxmox: "makima"
    vmid: 300
    monitor_enabled: true
    red:
      ip: "192.168.1.40/24"
      gateway: "192.168.1.30"
    recursos:
      cores: 1
      memoria: 512
      disco: 8
      disco_datos:
        storage: "hdd_data"
        size: "50G"
        mp: "/var/lib/victoria-metrics"
    firewall_externo:
      - puerto: 22
        protocolo: "tcp"
        descripcion: "SSH Admin"
      - puerto: 3000
        protocolo: "tcp"
        descripcion: "Grafana"
      - puerto: 8428
        protocolo: "tcp"
        descripcion: "VictoriaMetrics"

  # === UNICO recurso de prueba: firewall_externo declarado correctamente ===

  - nombre: "stress-fw-full"
    estado: "presente"
    tipo: "lxc"
    core: false
    efimero: true
    monitor_enabled: false
    os: "alpine"
    nodo_proxmox: "reze"
    vmid: 207
    red:
      ip: "192.168.1.61/24"
      gateway: "192.168.1.30"
    recursos:
      cores: 1
      memoria: 256
      disco: 4
    firewall_externo:
      - puerto: 22
        protocolo: "tcp"
        descripcion: "SSH Admin"
