# ==========================================
# EVE - SINGLE SOURCE OF TRUTH
# ==========================================

# NOTE: `firewall_externo` does NOT generate per-host Terraform resources.
# It's applied centrally via SDN on doom-gateway
# (see ansible/sdn-gateway/deploy-firewall.yml + templates/eve-firewall.j2).
# `terraform plan` will always show network { firewall = false } on every
# VM/LXC — that's expected behavior, not a bug.

# NOTE: any VM/LXC that needs Terraform's remote-exec provisioner to
# confirm SSH readiness MUST declare puerto: 22 (tcp) in firewall_externo.
# The SDN firewall is deny-by-default for all forwarded traffic into the
# LAN, including from the command station/CI runner running Terraform —
# there is no implicit bypass for the provisioning tool itself.

entornos:

  # === CORE INFRASTRUCTURE ===
  # These resources are physical or permanent.
  # The validator and the janitor never touch them.

  - nombre: "doom-gateway"
    estado: "presente"
    tipo: "gateway"
    core: true
    red:
      ip: "192.168.1.30/24"
      management_ip: "10.1.1.1"   # ZeroTier IP, used in CI/GitHub Actions

  - nombre: "makima-core"
    estado: "presente"
    tipo: "fisico"
    core: true
    red:
      ip: "192.168.1.20/24"
    firewall_externo:
      - puerto: 8006
        protocolo: "tcp"
        descripcion: "Proxmox GUI"

  - nombre: "reze-core"
    estado: "presente"
    tipo: "fisico"
    core: true
    red:
      ip: "192.168.1.10/24"
    firewall_externo:
      - puerto: 8006
        protocolo: "tcp"
        descripcion: "Proxmox GUI"

  # === MONITORING ===
  # VictoriaMetrics + Grafana. Set estado to 'presente' to activate it.

  - nombre: "eve-monitor"
    estado: "presente"
    tipo: "lxc"
    core: false
    efimero: false
    os: "alpine"
    nodo_proxmox: "makima"
    vmid: 300
    monitor_enabled: false
    red:
      ip: "192.168.1.40/24"
      gateway: "192.168.1.30"
    recursos:
      cores: 1
      memoria: 512
      disco: 8
      disco_datos:
        storage: "hdd_data"
        size: "50G"
        mp: "/var/lib/victoria-metrics"
    firewall_externo:
      - puerto: 22
        protocolo: "tcp"
        descripcion: "SSH Admin"
      - puerto: 3000
        protocolo: "tcp"
        descripcion: "Grafana"
      - puerto: 8428
        protocolo: "tcp"
        descripcion: "VictoriaMetrics"

  # === REFERENCE TEMPLATES ===
  # Examples of how to declare a VM and an LXC.
  # Set estado to 'presente' and adjust the values to deploy.

  - nombre: "eve-lab-vm"
    estado: "presente"
    tipo: "vm"
    core: false
    efimero: false
    monitor_enabled: true
    nodo_proxmox: "makima"
    vmid: 100
    plantilla: "debian13-template"
    red:
      ip: "192.168.1.41/24"
      gateway: "192.168.1.30"
    recursos:
      cores: 2
      memoria: 1024
      disco: 20
    firewall_externo:
      - puerto: 22
        protocolo: "tcp"
        descripcion: "SSH Admin"

  - nombre: "eve-lab-lxc"
    estado: "presente"
    tipo: "lxc"
    core: false
    efimero: false
    monitor_enabled: true
    os: "alpine"
    nodo_proxmox: "reze"
    vmid: 200
    red:
      ip: "192.168.1.42/24"
      gateway: "192.168.1.30"
    recursos:
      cores: 1
      memoria: 256
      disco: 4
    firewall_externo:
      - puerto: 22
        protocolo: "tcp"
        descripcion: "SSH Admin"
