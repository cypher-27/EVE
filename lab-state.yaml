# ==========================================
# EVE - SINGLE SOURCE OF TRUTH (v2.0)
# ==========================================

# NOTA: `firewall_externo` NO genera recursos de Terraform por host.
# Se aplica de forma centralizada vía SDN en doom-gateway
# (ver ansible/sdn-gateway/deploy-firewall.yml + templates/eve-firewall.j2).
# `terraform plan` mostrará siempre network { firewall = false } en cada
# VM/LXC — es el comportamiento esperado, no un bug.

entornos:

  # === INFRAESTRUCTURA CORE ===
  # Estos recursos son físicos o permanentes.
  # El validator y el janitor nunca los tocan.

  - nombre: "doom-gateway"
    estado: "presente"
    tipo: "gateway"
    core: true
    red:
      ip: "192.168.1.30/24"
      management_ip: "10.1.1.1"   # IP de ZeroTier, usada en CI/GitHub Actions

  - nombre: "makima-core"
    estado: "presente"
    tipo: "fisico"
    core: true
    red:
      ip: "192.168.1.20/24"
    firewall_externo:
      - puerto: 8006
        protocolo: "tcp"
        descripcion: "Proxmox GUI"

  - nombre: "reze-core"
    estado: "presente"
    tipo: "fisico"
    core: true
    red:
      ip: "192.168.1.10/24"
    firewall_externo:
      - puerto: 8006
        protocolo: "tcp"
        descripcion: "Proxmox GUI"

  # === MONITOREO ===
  # VictoriaMetrics + Grafana. Cambia estado a 'presente' para activarlo.

  - nombre: "eve-monitor"
    estado: "ausente"
    tipo: "lxc"
    core: false
    os: "alpine"
    nodo_proxmox: "makima"
    vmid: 300
    monitor_enabled: false
    red:
      ip: "192.168.1.40/24"
      gateway: "192.168.1.30"
    recursos:
      cores: 1
      memoria: 512
      disco: 8
      disco_datos:
        storage: "hdd_data"
        size: "50G"
        mp: "/var/lib/victoria-metrics"
    firewall_externo:
      - puerto: 22
        protocolo: "tcp"
        descripcion: "SSH Admin"
      - puerto: 3000
        protocolo: "tcp"
        descripcion: "Grafana"
      - puerto: 8428
        protocolo: "tcp"
        descripcion: "VictoriaMetrics"

  # === TEMPLATES DE REFERENCIA ===
  # Ejemplos de cómo declarar una VM y un LXC.
  # Cambia estado a 'presente' y ajusta los valores para desplegar.

  - nombre: "eve-lab-vm"
    estado: "ausente"
    tipo: "vm"
    core: false
    efimero: true
    monitor_enabled: true
    nodo_proxmox: "makima"
    vmid: 100
    plantilla: "debian13-template"
    red:
      ip: "192.168.1.41/24"
      gateway: "192.168.1.30"
    recursos:
      cores: 2
      memoria: 1024
      disco: 20
    firewall_externo:
      - puerto: 22
        protocolo: "tcp"
        descripcion: "SSH Admin"

  - nombre: "eve-lab-lxc"
    estado: "ausente"
    tipo: "lxc"
    core: false
    efimero: true
    monitor_enabled: true
    os: "alpine"
    nodo_proxmox: "reze"
    vmid: 200
    red:
      ip: "192.168.1.42/24"
      gateway: "192.168.1.30"
    recursos:
      cores: 1
      memoria: 256
      disco: 4
    firewall_externo:
      - puerto: 22
        protocolo: "tcp"
        descripcion: "SSH Admin"

